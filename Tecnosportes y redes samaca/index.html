<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Tecnosoportes y Redes Samacá</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #001d3d;
            overflow: hidden;
        }

        .pantalla-inicio {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(0, 40, 85, 0.9), rgba(0, 40, 85, 0.9)), 
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .logo-bienvenida {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
        }

        .pantalla-inicio h1 {
            color: white;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .pantalla-inicio p {
            color: #caf0f8;
            font-size: 1.2rem;
            margin-bottom: 35px;
            max-width: 600px;
        }

        .btn-ingresar {
            background: #00b4d8;
            color: white;
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
            transition: all 0.3s ease;
        }

        .btn-ingresar:hover {
            background: #0077b6;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.6);
        }
    </style>
</head>
<body>

    <main class="pantalla-inicio">
        <!-- Usa el nombre exacto de tu logo sin espacios -->
        <img src="logo de empresa.jpeg" alt="Logo Tecnosoportes & Redes Samacá" class="logo-bienvenida">
        <h1>Tecnosoportes y Redes Samacá S.A.S.</h1>
        <p>Soluciones integrales en infraestructura de redes, mantenimiento de computadores y servicios TI en todo Boyacá.</p>
        
        <!-- Redirige al segundo archivo -->
        <a href="servicios.html" class="btn-ingresar">INGRESAR</a>
    </main>



</body>
</html>
